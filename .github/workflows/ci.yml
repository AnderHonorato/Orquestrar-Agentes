name: CI Orquestrar
on:
  push:
    branches: [main, ander-flow/organic-orchestrator]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes Node (sem credenciais de provedores)
        env:
          NODE_ENV: test
        run: npm test
      - name: Verificar sintaxe dos arquivos principais
        run: |
          node --check server/index.js
          node --check server/orchestrator.js
          node --check server/engine.js
          node --check web/app.js
          node --check web/mascots.js
          node --check web/approvals-ui.js
